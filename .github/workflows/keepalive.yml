name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 12 * * *"   # Jeden Tag um 12:00 UTC
  workflow_dispatch:        # Manuell ausführbar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Wildverkauf
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: DEIN_API_KEY" \
            -H "Authorization: Bearer DEIN_API_KEY" \
            "https://smanaekfwmidqmulypxm.supabase.co/rest/v1/vw_sales?select=id&limit=1")
          echo "Wildverkauf Status: $STATUS"

      - name: Ping Virements mensuels
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: DEIN_API_KEY" \
            -H "Authorization: Bearer DEIN_API_KEY" \
            "https://hthtvosmugqcftrkpyvs.supabase.co/rest/v1/?limit=1")
          echo "Virements mensuels Status: $STATUS"
